name: Build APK

# Запускается сам при каждом изменении файлов, а ещё вручную: вкладка Actions → Build APK → Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установить зависимости
        run: npm install

      - name: Создать Android-проект
        run: npx cap add android

      - name: Настройки Android (только вертикально, вибрация)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<activity|<activity android:screenOrientation="portrait"|' "$M"
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|&\n    <uses-permission android:name="android.permission.VIBRATE" />|' "$M"

      - name: Постоянный ключ подписи (чтобы новые версии ставились поверх старых)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Скопировать игру в приложение
        run: npx cap sync android

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Выложить APK для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: umnozhalka-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
